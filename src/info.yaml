project:
  title: "Water Management System ASIC"
  author: "WMS Design Team"
  discord: ""
  description: "Debounced Water Management Controller with 60s Grace Timer & Alarm Mute Latch"
  language: "Verilog"
  
  # Top module MUST match the wrapper in project.v
  top_module: "tt_um_wms_system"

  # List source files inside src/
  source_files:
    - "project.v"

# Pinout mapping for Tiny Tapeout documentation and board layout
pinout:
  inputs:
    - "Tank 10%"
    - "Tank 30%"
    - "Tank 50%"
    - "Tank 70%"
    - "Tank 90%"
    - "Tank 100%"
    - "Lower Tank Sensor"
    - "Water Flow Probe"
  outputs:
    - "Pump Relay Driver"
    - "Fault Indicator LED"
    - "Alarm Sounder Output"
    - "Lower Tank Active LED"
    - "Tank 10% LED"
    - "Tank 50% LED"
    - "Tank 90% LED"
    - "Tank 100% LED"
  bidirectional:
    - "Alarm Mute Button"
    - "Unused"
    - "Unused"
    - "Unused"
    - "Unused"
    - "Unused"
    - "Unused"
    - "Unused"
