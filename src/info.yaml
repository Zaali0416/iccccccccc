project:
  title: "Water Management System ASIC"
  author: "WMS Design Team"
  discord: ""
  description: "Debounced Water Management Controller with 60s Grace Timer & Alarm Mute Latch"
  language: "Verilog"
  top_module: "tt_um_wms_system"

  # List of verilog files relative to src/
  source_files:
    - "project.v"

# Pinout configuration for hardware layout
pinout:
  inputs:
    - "Tank 10%"
    - "Tank 30%"
    - "Tank 50%"
    - "Tank 70%"
    - "Tank 90%"
    - "Tank 100%"
    - "Lower Tank Sensor"
    - "Water Flow Probe"
  outputs:
    - "Pump Relay Driver"
    - "Fault Indicator LED"
    - "Alarm Sounder Output"
    - "Lower Tank Active LED"
    - "Tank 10% LED"
    - "Tank 50% LED"
    - "Tank 90% LED"
    - "Tank 100% LED"
  bidirectional:
    - "Alarm Mute Button"
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"

# Required by the docs generation workflow
documentation:
  how_it_works: "Monitors upper and lower tank water sensors with digital debouncing and CDC synchronization. Controls pump output based on hysteresis and tracks a 60-second grace timer for flow verification."
  how_to_test: "Apply clock and active-low reset. Toggle input sensors to observe pump control on uo_out[0] and fault triggers when water flow probe is inactive."
  external_hardware: "Water level float sensors, pump relay module, buzzer, status LEDs."
